# 1Panel 反向代理配置：cosai.junhai.work → 10.1.1.21:3001
# 用法：网站 → 选择该网站 → 反向代理 → 代理路径填 /，代理地址填 http://10.1.1.21:3001
#       若 1Panel 允许整段编辑，则用下方「完整 location 块」替换原有配置；
#       若仅允许填写 location 内部指令，则用「仅内部指令」块。

# ---------- 完整 location 块（整段粘贴到反向代理配置）----------
location ^~ / {
    proxy_pass http://10.1.1.21:3001;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header REMOTE-HOST $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Port $server_port;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 86400s;
    proxy_send_timeout 86400s;
    add_header X-Cache $upstream_cache_status;
    proxy_ssl_server_name off;
    proxy_ssl_name $proxy_host;
}

