# 1Panel 反向代理配置：cosix.junhai.work → Matrix Synapse 10.1.1.15:8008
# 用法：网站 → 选择该网站 → 反向代理 → 代理路径填 /，代理地址填 http://10.1.1.15:8008
#       注意：proxy_pass 后不要加路径（不要写 / 或 /_matrix），否则 Synapse 签名校验会失败。
#       若只代理 /_matrix 与 /_synapse/client 更安全，见下方「完整 location 块」。

# ---------- 完整 location 块（Synapse 要求只代理 /_matrix 与 /_synapse/client）----------
# 若 1Panel 只允许一个 location，可先配 /_matrix，再在「高级」里补一条 /_synapse/client 同目标
location ~ ^(/_matrix|/_synapse/client) {
    proxy_pass http://10.1.1.15:8008;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 86400s;
    proxy_send_timeout 86400s;
    client_max_body_size 50M;
}

# ---------- 若 1Panel 仅支持填写 location 内部指令（无 location 行），只复制下面这段 ----------
# 注意：1Panel 需在「代理路径」里填 /_matrix 和 /_synapse/client（两条或正则），否则用上面完整块
