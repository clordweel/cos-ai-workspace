# ---------- Synapse 侧 ----------
# 反向代理后需在 homeserver.yaml 对应 listener (8008) 下设置 x_forwarded: true，以便记录真实 IP 与生成正确 URL。
# 可选：bind_addresses: ['127.0.0.1'] 仅本机访问（非容器部署时）。
