# 单域名 cosai.junhai.work 同时承载：前端(3001)、API(3000)、Matrix(8008)
# 替代 cosapi、cosix 三个域名，便于证书与运维。1Panel：在 cosai 站点下配置「反向代理」时，
# 若支持多 location，按顺序添加下列三块；若仅支持一段，见下方「合并说明」。

# ---------- 1. Matrix（必须用 ^~ 前缀，且排在 ^~ / 之前；否则 ^~ / 会先匹配 /_matrix 并转发到前端）----------
# Nginx：^~ 前缀按「最长匹配」选一个后不再检查正则；location ^~ / 会匹配所有路径导致 Matrix 请求被误转到前端。
# 故 Matrix 用 ^~ /_matrix 与 ^~ /_synapse，使 /_matrix/... 和 /_synapse/... 优先于 ^~ /。
location ^~ /_matrix {
    proxy_pass http://10.1.1.15:8008;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 86400s;
    proxy_send_timeout 86400s;
    client_max_body_size 50M;
}
location ^~ /_synapse {
    proxy_pass http://10.1.1.15:8008;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 86400s;
    proxy_send_timeout 86400s;
    client_max_body_size 50M;
}

# ---------- 2. API（/api 走中间层）----------
location ^~ /api {
    proxy_pass http://10.1.1.21:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 86400s;
    proxy_send_timeout 86400s;
}

# ---------- 3. 前端（其余路径 SPA + HMR /ws）----------
location ^~ / {
    proxy_pass http://10.1.1.21:3001;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header REMOTE-HOST $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Port $server_port;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 86400s;
    proxy_send_timeout 86400s;
    add_header X-Cache $upstream_cache_status;
    proxy_ssl_server_name off;
    proxy_ssl_name $proxy_host;
}

# ---------- 合并说明（1Panel 仅支持一个代理时）----------
# 1Panel 若只能配一个「代理路径」+ 一个「代理地址」，无法实现单域名三分流。
# 解决：在 1Panel 的「配置修改」里直接编辑该站点的 nginx 配置，在 server 块内按上顺序
# 放入上述三个 location，保存后重载。或使用「自定义配置」插入上述内容。
# ---------- 环境变量（单域名时统一为 cosai）----------
# apps/api/.env：FRONTEND_ORIGIN=https://cosai.junhai.work，API_PUBLIC_ORIGIN=https://cosai.junhai.work
# 根 .env：MATRIX_BASE_URL=http://10.1.1.15:8008（API 内网直连，避免 fetch failed），MATRIX_PUBLIC_BASE_URL=https://cosai.junhai.work（下发给前端）
# apps/web/.env：DEV_SERVER_WS_PUBLIC_URL=https://cosai.junhai.work（开发时 HMR）
# 后端地址按实际修改：API 若在 10.1.1.15 则改为 http://10.1.1.15:3000，Matrix 已是 10.1.1.15:8008。
