# Nginx：将 login/logout/refresh 转 MAS，其余转 Synapse
# 与 docker-compose.mas.yml 配合

server {
    listen 80;
    server_name _;
    client_max_body_size 50M;

    # Element 自动发现：.well-known/matrix/client（需 bootstrap-mas 生成 well-known/matrix/client）
    location = /.well-known/matrix/client {
        alias /var/www/well-known/matrix/client;
        default_type application/json;
        add_header Access-Control-Allow-Origin *;
    }

    # 健康检查（转发到 Synapse）
    location = /health {
        proxy_pass http://synapse:8008/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # MAS Admin API（Personal Session、用户查询等）
    location /api/ {
        proxy_http_version 1.1;
        proxy_pass http://mas:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # MAS OAuth2（client_credentials 等）
    location /oauth2/ {
        proxy_http_version 1.1;
        proxy_pass http://mas:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # MAS 兼容层：login / logout / refresh
    location ~ ^/_matrix/client/(v1|v3|r0)/(login|logout|refresh) {
        proxy_http_version 1.1;
        proxy_pass http://mas:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 其余 Matrix / Synapse 流量
    location ~ ^(/_matrix|/_synapse) {
        proxy_pass http://synapse:8008;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
