# Nginx：禁用 MAS，所有 Matrix 流量直接转 Synapse
# 与 docker-compose.no-mas.yml 配合，用于方案 A（回退纯 Synapse 原生认证）

server {
    listen 80;
    server_name _;
    client_max_body_size 50M;

    location = /.well-known/matrix/client {
        alias /var/www/well-known/matrix/client;
        default_type application/json;
        add_header Access-Control-Allow-Origin *;
    }

    location = /health {
        proxy_pass http://synapse:8008/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 全部 Matrix/Synapse 流量（含 login/logout/refresh）转 Synapse
    location ~ ^(/_matrix|/_synapse) {
        proxy_pass http://synapse:8008;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
