# MAS 扩展：与 docker-compose.yml 一起使用
# 使用: docker compose -f docker-compose.yml -f docker-compose.mas.yml up -d

services:
  synapse:
    ports: !reset []  # 由 nginx 对外暴露 8008，Synapse 仅内网

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "${SYNAPSE_HTTP_PORT:-8008}:80"
    volumes:
      - ./nginx-mas.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - synapse
      - mas
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:80/health"]
      interval: 10s
      timeout: 3s
      retries: 3

  mas-postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${MAS_POSTGRES_USER:-mas}
      POSTGRES_PASSWORD: ${MAS_POSTGRES_PASSWORD:?请设置 MAS_POSTGRES_PASSWORD}
      POSTGRES_DB: ${MAS_POSTGRES_DB:-mas}
      POSTGRES_INITDB_ARGS: "--locale=C"
    volumes:
      - mas_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${MAS_POSTGRES_USER:-mas} -d ${MAS_POSTGRES_DB:-mas}"]
      interval: 5s
      timeout: 5s
      retries: 5

  mas:
    image: ghcr.io/element-hq/matrix-authentication-service:latest
    restart: unless-stopped
    depends_on:
      mas-postgres:
        condition: service_healthy
    environment:
      MAS_CONFIG: /app/config/config.yaml:/app/config/override.yaml
    volumes:
      - ./mas-config:/app/config:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  mas_postgres_data:
